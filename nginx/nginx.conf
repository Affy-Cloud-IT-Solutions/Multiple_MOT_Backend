# ==============================================================================
# Global Nginx Configuration (Optimized for High Performance & Security)
# ==============================================================================
user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide Nginx version (Prevents server fingerprinting by attackers)
    server_tokens off;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    # Anti-Slowloris & Buffer Overflow Protections
    client_body_timeout       15s;
    client_header_timeout     15s;
    keepalive_timeout         30s;
    send_timeout              15s;
    
    client_body_buffer_size   128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_max_body_size      50m;

    # Logging format with real client IP support
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Real IP from Reverse Proxies / Cloudflare
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ==========================================================================
    # BOTNET & MALICIOUS SCANNER BLOCKING MAP
    # ==========================================================================
    map $http_user_agent $bad_bot {
        default 0;
        ~*(?i)(sqlmap|nikto|wpscan|masscan|dirbuster|acunetix|nessus|openvas|havij|zaproxy|nmap) 1;
        ~*(?i)(morfeus|fuzz|shodan|censys|zoomeye|binlar|casper|cmsworldmap|comodo|diavol|dotbot) 1;
        ~*(?i)(feedfinder|flicky|ia_archiver|jakarta|kmccrew|libwww|planetwork|pycurl|skygrid) 1;
        ~*(?i)(blexbot|mj12bot|ahrefsbot|semrushbot|seokicks|megaindex|exabot|linkdexbot) 1;
        "" 1; # Block completely empty User-Agents
    }

    # ==========================================================================
    # RATE LIMITING & DDOS MITIGATION ZONES
    # ==========================================================================
    # General API limit: 20 requests/sec per IP, with 10MB memory zone (holds ~160,000 IPs)
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=20r/s;
    
    # Sensitive Auth endpoints limit: 5 requests/sec per IP (Brute-force protection)
    limit_req_zone $binary_remote_addr zone=api_auth_limit:10m rate=5r/s;

    # Maximum simultaneous connections per IP: 20 connections
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;

    # Status 429 when rate limit is exceeded
    limit_req_status 429;
    limit_conn_status 429;

    # Load site configuration files
    include /etc/nginx/conf.d/*.conf;
}
