# ==============================================================================
# Nginx Virtual Host Configuration: api.ondoorcarservice.com
# Hardened against Botnets, DDoS, Scanners, and Unauthorized Access
# ==============================================================================

# Upstream definition for Docker backend container
upstream backend_app {
    server backend:5000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server Block (Port 80) -> ACME Challenge & SSL Redirection
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.ondoorcarservice.com;

    # Let's Encrypt / Certbot ACME Challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP traffic to HTTPS securely
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server Block (Port 443) -> SSL Termination & Reverse Proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.ondoorcarservice.com;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.ondoorcarservice.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ondoorcarservice.com/privkey.pem;

    # Modern TLS Security & High-Strength Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Enterprise Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; frame-ancestors 'self';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Botnet and malicious crawler mitigation
    if ($bad_bot) {
        return 403;
    }

    # Only allow safe HTTP methods
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$ ) {
        return 405;
    }

    # Block access to hidden files (.env, .git, .htaccess, etc.)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block common scanning attack paths (PHP, WordPress, phpMyAdmin, config dumps)
    location ~* (\.php|\.aspx|\.asp|\.jsp|\.cgi|\.py|\.sh|wp-admin|wp-login|xmlrpc|phpmyadmin|pma|config\.json|\.bak|\.sql)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Apply global connection concurrency limit
    limit_conn addr_conn_limit 20;

    # Custom JSON error bodies for API clients
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"success":false,"status":429,"message":"Too many requests. Please slow down and try again later."}';
    }

    error_page 403 = @forbidden;
    location @forbidden {
        default_type application/json;
        return 403 '{"success":false,"status":403,"message":"Access forbidden."}';
    }

    # --------------------------------------------------------------------------
    # Static Uploads Delivery with Script Execution Lockdown
    # --------------------------------------------------------------------------
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        
        # NEVER allow executing scripts in uploads directory
        location ~* \.(php|pl|py|jsp|asp|sh|cgi|bin|exe|bat|js)$ {
            deny all;
        }

        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Auth Endpoints - Strict Brute-Force Rate Limiting
    # --------------------------------------------------------------------------
    location /api/auth/ {
        limit_req zone=api_auth_limit burst=10 nodelay;
        
        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;
    }

    # --------------------------------------------------------------------------
    # General API Routes & Health Checks
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=api_general_limit burst=35 nodelay;

        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }
}
