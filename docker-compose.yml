# ==============================================================================
# Docker Compose Orchestration for MOT Backend & Hardened Nginx Proxy
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. Node.js Backend Application Service (Production Container)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mot_backend_app
    restart: always
    ports:
      # Expose on localhost 5000 for secure reverse proxy access
      - "127.0.0.1:5000:5000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      # Persistent storage for user uploads (survives rebuilds/restarts)
      - ./uploads:/app/uploads
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - mot_network

  # ----------------------------------------------------------------------------
  # 2. Hardened Nginx Reverse Proxy (Used in Standalone Deployments)
  # ----------------------------------------------------------------------------
  nginx:
    profiles:
      - standalone
    image: nginx:1.27-alpine
    container_name: mot_nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./uploads:/var/www/uploads:ro
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mot_network

  # ----------------------------------------------------------------------------
  # 3. Certbot Service (Automated SSL Renewal for Standalone Profile)
  # ----------------------------------------------------------------------------
  certbot:
    profiles:
      - standalone
    image: certbot/certbot:latest
    container_name: mot_certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - mot_network

networks:
  mot_network:
    driver: bridge
