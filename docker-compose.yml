# ==============================================================================
# Docker Compose Orchestration for MOT Backend Service
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # Node.js Backend Application Service (Production Container)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mot_backend_app
    restart: always
    ports:
      # Bound to localhost:5000 for secure reverse proxy access
      - "127.0.0.1:5000:5000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      # Persistent storage for user uploads (survives container updates)
      - ./uploads:/app/uploads
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - mot_network

networks:
  mot_network:
    driver: bridge
